name: Build contract

# Compiles the Owl Toons NEAR contract to WebAssembly in public, on every change,
# and commits the result to res/owl_toons.wasm so anyone can check what is deployed.
on:
  push:
    branches: [main]
    paths: ["contract/**", ".github/workflows/build-contract.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Unit tests
        working-directory: contract
        run: cargo test
      - name: Build wasm
        working-directory: contract
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Commit wasm
        run: |
          mkdir -p res
          cp contract/target/near/owl_toons.wasm res/owl_toons.wasm
          sha256sum res/owl_toons.wasm > res/owl_toons.wasm.sha256
          git config user.name "owl-toons-builder"
          git config user.email "actions@users.noreply.github.com"
          git add res
          git diff --cached --quiet || git commit -m "Build contract wasm"
          git push
