[package]
name = "owl-toons"
description = "Owl Toons: an AI cartoon studio on NEAR. Fans vote on the plot, the agent publishes episodes as NFTs and splits every tip on chain."
version = "0.1.0"
edition = "2021"
repository = "https://github.com/justhoodl/hoodlowl-toons"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.15"
near-contract-standards = "5.15"

[dev-dependencies]
near-sdk = { version = "5.15", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
